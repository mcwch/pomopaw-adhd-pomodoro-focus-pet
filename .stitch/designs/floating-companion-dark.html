<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Focus Companion - Focus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",

                extend: {

                        "slate": "#67869B",
                        "lion-mane": "#4678D7",
                        "surface-container-high": "#e5e9ea",
                        "on-primary-fixed": "#001e30",
                        "secondary": "#006b5e",
                        "tertiary-fixed-dim": "#eac160",
                        "background": "#f6fafb",
                        "outline-variant": "#c2c7ce",
                        "secondary-fixed": "#94f4e2",
                        "on-secondary-container": "#007164",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f6fafb",
                        "surface": "#f6fafb",
                        "surface-tint": "#3d627f",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#244a66",
                        "inverse-primary": "#a6cbec",
                        "surface-container-highest": "#dfe3e4",
                        "on-primary-container": "#83a8c7",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#00201b",
                        "primary": "#00273d",
                        "on-tertiary-container": "#c49f41",
                        "on-surface-variant": "#42474d",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2c3132",
                        "tertiary-container": "#4a3700",
                        "on-surface": "#181c1d",
                        "primary-fixed": "#cbe6ff",
                        "primary-container": "#143d58",
                        "secondary-fixed-dim": "#78d7c6",
                        "outline": "#72787e",
                        "on-secondary-fixed-variant": "#005047",
                        "inverse-on-surface": "#edf1f2",
                        "surface-dim": "#d6dbdc",
                        "lion-body": "#F5D27A",
                        "tertiary": "#302200",
                        "error-container": "#ffdad6",
                        "surface-container": "#eaeff0",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#251a00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "rail-width": "280px",
                        "margin-page": "40px",
                        "base": "8px",
                        "canvas-max-width": "800px",
                        "gutter": "32px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "display-timer": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-timer": ["120px", { "lineHeight": "120px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .timer-ring {
            stroke-dasharray: 880;
            stroke-dashoffset: 220; /* 25% complete for visual interest */
            transition: stroke-dashoffset 1s linear;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased overflow-hidden selection:bg-secondary-fixed-dim selection:text-on-secondary-fixed">
<!-- Top Navigation Bar -->
<nav class="bg-surface dark:bg-inverse-surface flex justify-between items-center w-full px-margin-page py-4 max-w-full docked full-width top-0 border-b border-slate/20 dark:border-outline-variant/20 flat no shadows z-50 fixed">
<div class="flex items-center gap-4">
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">FocusLion</span>
</div>
<div class="hidden md:flex gap-8 items-center">
<a class="text-primary dark:text-inverse-primary border-b-2 border-primary dark:border-inverse-primary pb-1 font-body-md text-body-md" href="#">Focus</a>
<a class="text-on-surface-variant dark:text-surface-variant hover:text-secondary dark:hover:text-secondary-fixed-dim transition-colors duration-200 font-body-md text-body-md" href="#">Progress</a>
<a class="text-on-surface-variant dark:text-surface-variant hover:text-secondary dark:hover:text-secondary-fixed-dim transition-colors duration-200 font-body-md text-body-md" href="#">Friends</a>
</div>
<div class="flex gap-4">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</nav>
<!-- Main Layout -->
<div class="flex h-screen pt-[73px]">
<!-- Today Rail (Left Sidebar) -->
<aside class="hidden md:flex flex-col bg-surface-container-low dark:bg-surface-container border-r border-slate/20 w-rail-width h-full flex-shrink-0 z-40 fixed left-0 top-[73px]">
<div class="p-6 flex flex-col gap-6 h-full">
<!-- Header -->
<div class="flex items-center gap-3">
<img alt="Chibi Lion Profile" class="w-10 h-10 rounded-full object-cover border border-outline-variant" data-alt="A small, soft-shaded illustration of a cute chibi lion with a blue mane, acting as a profile avatar in a minimalist ui context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6BKU4EErm1WckPMsXuBv1J1hqV0sWR7_FSlJvOo5YtCms7ure4vtsD2d3NaEKftkzqDFk3l4sRH5CQsLOU8rlyYbEXOeau7rdRgvYvkUTGENjG1k5KWuvNe39eBFA3VI4TyZWpSg6Ffd-23vyfdYT2EUEEZnFRk_Fvq5fcnz_1IPHdqrti5et_A6EIr2pVX51itPTbKsWRGv0ixnoFIEd0HYx47g1lTQh5xEn_Wnv9z-rFHTl3-LCd7qd05WOtExcbDJTBQWtybIo"/>
<div>
<h2 class="font-headline-md text-headline-md text-primary text-[18px] leading-tight">Today Rail</h2>
<p class="font-label-sm text-label-sm text-slate">Stay Focused</p>
</div>
</div>
<!-- Navigation Tabs -->
<nav class="flex flex-col gap-2">
<button class="bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl flex items-center gap-3 p-3 font-body-md text-body-md transition-opacity opacity-100 w-full text-left">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
                        Today's Tasks
                    </button>
<button class="text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-highest dark:hover:bg-surface-variant rounded-xl flex items-center gap-3 p-3 font-body-md text-body-md transition-colors w-full text-left">
<span class="material-symbols-outlined" data-icon="target">target</span>
                        Objectives
                    </button>
<button class="text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-highest dark:hover:bg-surface-variant rounded-xl flex items-center gap-3 p-3 font-body-md text-body-md transition-colors w-full text-left">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
                        Archive
                    </button>
</nav>
<!-- Task List Area -->
<div class="mt-4 flex-grow flex flex-col gap-3 overflow-y-auto pr-2">
<h3 class="font-label-sm text-label-sm text-slate uppercase tracking-wider mb-2">Active Tasks</h3>
<!-- Task Item 1 -->
<div class="flex items-start gap-3 p-2 rounded-lg hover:bg-surface-container transition-colors group cursor-pointer">
<div class="w-5 h-5 rounded-[4px] border-2 border-slate flex-shrink-0 mt-0.5 group-hover:border-primary transition-colors"></div>
<span class="font-body-md text-body-md text-on-surface flex-grow">Complete UI Mockups</span>
</div>
<!-- Task Item 2 -->
<div class="flex items-start gap-3 p-2 rounded-lg hover:bg-surface-container transition-colors group cursor-pointer">
<div class="w-5 h-5 rounded-[4px] border-2 border-slate flex-shrink-0 mt-0.5 group-hover:border-primary transition-colors"></div>
<span class="font-body-md text-body-md text-on-surface flex-grow">Review User Feedback</span>
</div>
</div>
<!-- CTA -->
<button class="mt-auto bg-primary-container text-on-primary rounded-xl py-3 px-4 font-label-sm text-label-sm flex items-center justify-center gap-2 hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined text-[18px]">add</span>
                    Add Task
                </button>
</div>
</aside>
<!-- Focus Canvas (Center) -->
<main class="flex-grow flex flex-col items-center justify-center md:ml-rail-width p-margin-page relative">
<div class="w-full max-w-canvas-max-width flex flex-col items-center">
<!-- Timer Container -->
<div class="relative w-[400px] h-[400px] flex items-center justify-center mb-12">
<!-- SVG Ring -->
<svg class="absolute inset-0 w-full h-full -rotate-90 transform" viewbox="0 0 300 300">
<!-- Background Track -->
<circle cx="150" cy="150" fill="none" r="140" stroke="#dfe3e4" stroke-width="4"></circle>
<!-- Progress Track -->
<circle class="timer-ring" cx="150" cy="150" fill="none" r="140" stroke="#77D6C5" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Time Display -->
<div class="z-10 flex flex-col items-center">
<span class="font-display-timer text-display-timer text-primary tracking-tighter">25:00</span>
<span class="font-label-sm text-label-sm text-slate mt-4 uppercase tracking-widest">Focus Session</span>
</div>
</div>
<!-- Primary Action -->
<button class="bg-primary-container text-on-primary font-body-lg text-body-lg px-10 py-4 rounded-[12px] hover:bg-opacity-90 transition-all flex items-center gap-3">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
                    Start Focus
                </button>
</div>
</main>
</div>
<!-- Floating Companion -->
<div class="fixed bottom-8 right-8 z-50 flex flex-col items-center" id="floating-companion">
<div class="relative group cursor-pointer">
<!-- Close affordance -->
<button class="absolute -top-2 -right-2 bg-surface border border-outline-variant text-slate w-6 h-6 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-10 hover:text-error hover:border-error" onclick="document.getElementById('floating-companion').style.display='none'">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
<!-- Status Bubble -->
<div class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-surface shadow-[0px_10px_30px_rgba(20,61,88,0.08)] border border-slate/20 rounded-xl px-4 py-2 whitespace-nowrap pointer-events-none">
<span class="font-label-sm text-label-sm text-primary">Studying with you.</span>
<!-- Bubble Tail -->
<div class="absolute -bottom-1.5 left-1/2 transform -translate-x-1/2 w-3 h-3 bg-surface border-b border-r border-slate/20 rotate-45"></div>
</div>
<!-- Chibi Image -->
<img alt="Chibi Companion" class="w-48 h-auto object-contain filter drop-shadow-md transition-transform hover:scale-105 duration-300" src="https://lh3.googleusercontent.com/aida/AP1WRLu7NrWwxOvq3CVpur0rixuQzN0QO7YpRDpIvpx4aHWjrWFVZ2YLo-nd_Ow0Pn3HMk7PcsckYI_nRzR9qqkSgm2xjGlcD2KLIJTMlph_3ERp4XxWiqwlmrbblKbww7zYazQ4jh-1fqu8hFwOqV4fR1aBFljQqbLFxxA_IaNOhtbIugfJ4LTD8ocmeSR7Bz4-tfNhOBlQbOOItG2BPdNWhLBOWdAOIrfXjCqu19mZ-dYEJMoLDSp4yvsoOoY"/>
</div>
</div>
</body></html>
